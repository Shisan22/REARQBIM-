version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rearq_bim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rearq_admin
      POSTGRES_PASSWORD: RearqPassword2026!
      POSTGRES_DB: rearq_bim_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02_seeds.sql
    networks:
      - rearq_network

volumes:
  postgres_data:
    driver: local

networks:
  rearq_network:
    driver: bridge
